[project]
name = "bitcoin-script"
version = "0.1.0"
description = "Bitcoin Script interpreter with K Framework integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kframework>=7.1.313",
    "python-bitcoinlib>=0.12.2",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
]

[project.scripts]
bitcoin-script = "bitcoin_script.cli:app"

[project.optional-dependencies]
k = ["kframework"]

[project.entry-points.kdist]
bitcoin-script-semantics = "bitcoin_script.k_semantics.kdist.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitcoin_script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not rpc and not k and not mainnet'"
markers = [
    "rpc: tests that require a running Bitcoin Core RPC node",
    "k: tests that require K Framework and a compiled K definition",
    "mainnet: tests that require Bitcoin Core mainnet block files and K Framework",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
exclude = [
    "src/bitcoin_script/k_semantics/kdist/plugin",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    ".venv",
    "src/bitcoin_script/k_semantics/kdist/plugin/deps",
    "src/bitcoin_script/k_semantics/kdist/plugin/krypto",
]

[dependency-groups]
dev = [
    "ecdsa>=0.19.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]
