[project]
name = "bitcoin-script"
version = "0.1.0"
description = "Bitcoin Script interpreter with K Framework integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-bitcoinlib>=0.12.2",
    "typer>=0.24.1",
]

[project.scripts]
bitcoin-script = "bitcoin_script.cli:app"

[project.optional-dependencies]
k = ["kframework"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitcoin_script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not rpc'"
markers = [
    "rpc: tests that require a running Bitcoin Core RPC node",
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["bitcoin_script"]
mypy_path = "src"

[tool.ruff]
target-version = "py313"
src = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]
