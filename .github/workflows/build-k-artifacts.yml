name: Build K Artifacts

on:
  push:
    branches: [presentation2]
    paths:
      - "src/bitcoin_script/k_semantics/**"
      - ".github/workflows/build-k-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-k:
    name: Build K Definition (Linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: runtimeverificationinc/kframework-k:ubuntu-jammy-7.1.313
    env:
      XDG_CACHE_HOME: /tmp/k-cache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-14 cmake curl pkg-config \
            libboost-test-dev libcrypto++-dev libsecp256k1-dev \
            libssl-dev libyaml-dev libgmp-dev libmpfr-dev \
            llvm-14-dev llvm-14-tools \
            python3 python3-dev python3-pip \
            libffi-dev tar

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python 3.14 + project deps
        run: |
          uv python install 3.14
          uv python pin 3.14
          uv sync --frozen

      - name: Build K definition (LLVM + lib)
        run: |
          CXX=clang++-14 uv run kdist --verbose build -j$(nproc) \
            bitcoin-script-semantics.llvm \
            bitcoin-script-semantics.llvm-lib

      - name: Package artifacts
        run: |
          LLVM_DIR=$(uv run python -c "from pyk.kdist import kdist; print(kdist.get('bitcoin-script-semantics.llvm'))")
          LIB_DIR=$(uv run python -c "from pyk.kdist import kdist; print(kdist.get('bitcoin-script-semantics.llvm-lib'))")

          # Bundle required shared libraries that may not exist on the target
          mkdir -p /tmp/k-syslibs
          for lib in libsecp256k1.so.0 libcryptopp.so libff.so libcrypto.so.3; do
            found=$(find /usr/lib /usr/local/lib -name "$lib*" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp -L "$found" /tmp/k-syslibs/
              echo "Bundled: $found"
            fi
          done
          ls -lh /tmp/k-syslibs/

          mkdir -p /tmp/k-artifacts
          tar czf /tmp/k-artifacts/k-linux-x86_64.tar.gz \
            -C "$(dirname "$LLVM_DIR")" \
            "$(basename "$LLVM_DIR")" \
            -C "$(dirname "$LIB_DIR")" \
            "$(basename "$LIB_DIR")" \
            -C /tmp \
            k-syslibs
          ls -lh /tmp/k-artifacts/

      - name: Upload as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install gh CLI (not in the K container)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update && apt-get install -y gh

          # Delete old release if it exists, create new one
          gh release delete k-artifacts --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create k-artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --title "K Build Artifacts (Linux x86_64)" \
            --notes "Auto-built K LLVM definition for the presentation server. Do not delete." \
            --prerelease \
            /tmp/k-artifacts/k-linux-x86_64.tar.gz

      - name: Upload as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: k-linux-x86_64
          path: /tmp/k-artifacts/
          retention-days: 90
