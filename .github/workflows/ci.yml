name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pyright typecheck
        run: uv run pyright src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests (excluding K Framework and RPC)
        run: uv run pytest --tb=short -q

  test-k:
    name: K Framework Tests
    runs-on: ubuntu-latest
    needs: code-quality
    container:
      image: runtimeverificationinc/kframework-k:ubuntu-jammy-7.1.313
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-14 cmake curl pkg-config \
            libboost-test-dev libcrypto++-dev libsecp256k1-dev \
            libssl-dev libyaml-dev libgmp-dev libmpfr-dev \
            llvm-14-dev llvm-14-tools \
            python3 python3-dev python3-pip \
            libffi-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python 3.14 via uv
        run: |
          uv python install 3.14
          uv python pin 3.14

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Build K definition
        run: |
          CXX=clang++-14 uv run kdist --verbose build -j$(nproc) bitcoin-script-semantics.llvm

      - name: Run K Framework tests
        run: uv run pytest -m k --tb=short -q
