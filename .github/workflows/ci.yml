name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pyright typecheck
        run: uv run pyright src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests (excluding K Framework and RPC)
        run: uv run pytest --tb=short -q

  test-k:
    name: K Framework Tests
    runs-on: ubuntu-latest
    needs: code-quality
    container:
      image: runtimeverificationinc/kframework-k:ubuntu-jammy-7.1.313
    env:
      XDG_CACHE_HOME: /tmp/k-cache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-14 cmake curl pkg-config \
            libboost-test-dev libcrypto++-dev libsecp256k1-dev \
            libssl-dev libyaml-dev libgmp-dev libmpfr-dev \
            llvm-14-dev llvm-14-tools \
            python3 python3-dev python3-pip \
            libffi-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python 3.14 via uv
        run: |
          uv python install 3.14
          uv python pin 3.14

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Cache K build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/k-cache
          key: k-build-${{ hashFiles('src/bitcoin_script/k_semantics/kdist/plugin.py', 'src/bitcoin_script/k_semantics/kdist/script-semantics/**') }}
          restore-keys: |
            k-build-

      - name: Build K definition (LLVM)
        run: |
          CXX=clang++-14 uv run kdist --verbose build -j$(nproc) bitcoin-script-semantics.llvm bitcoin-script-semantics.llvm-lib

      - name: Run K Framework tests
        run: uv run pytest -m k -k "not test_prove" --tb=short -q

      - name: Build K definition (Haskell)
        run: |
          uv run kdist --verbose build bitcoin-script-semantics.haskell

      - name: Run K proof specs
        run: uv run pytest tests/test_k_specs/ -m k --tb=short -q
